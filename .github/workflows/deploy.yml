name: Deploy em Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar código
        run: |
          cd /home/totem-software/api-dados
          git fetch origin
          git reset --hard origin/main

      - name: Build
        run: |
          cd /home/totem-software/api-dados
          npm ci
          npm run build

      - name: Deploy
        run: |
          cd /home/totem-software/api-dados
          pm2 restart apidados --update-env